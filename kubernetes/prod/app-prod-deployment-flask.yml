apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-api-prod
  labels:
    app: flask-api-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-api-prod
  template:
    metadata:
      labels:
        app: flask-api-prod
    spec:
      containers:
        - name: flask
          image: ssinghal37/ml_flask_app:1.0
          ports:
            - containerPort: 5000
          env:
            - name: REDIS_HOST
              value: redis-db-prod
            - name: REDIS_PORT
              value: "6379"
            - name: LOG_LEVEL
              value: INFO
